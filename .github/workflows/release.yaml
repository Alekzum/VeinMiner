name: Check, Archive and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag for manual release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  lint:
    uses: ./.github/workflows/lint.yaml

  build-and-release:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update pack.mcmeta version
        env:
          RELEASE_VERSION: ${{ inputs.tag_name || github.ref_name }}
        run: |
          if [ -f "src/pack.mcmeta" ]; then
            jq --arg ver "\n\u00A77Version $RELEASE_VERSION" '.pack.description |= . + $ver' src/pack.mcmeta > src/pack.mcmeta.tmp && mv src/pack.mcmeta.tmp src/pack.mcmeta
          fi

      - name: Archive files
        run: |
          mkdir -p dist
          cd src
          zip -r ../dist/vein-miner.zip .
          tar -czf ../dist/vein-miner.tar.gz .

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag_name || github.ref_name }}
          name: "Release ${{ inputs.tag_name || github.ref_name }}"
          generateReleaseNotes: true
          artifacts: "dist/*"
