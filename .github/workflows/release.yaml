name: Archive and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  lint:
    uses: ./.github/workflows/lint.yaml

  build-and-release:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get release version
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Determine Minecraft Version
        id: mc_version
        shell: bash
        run: |
          BRANCH_NAME=$(git branch -r --contains ${{ steps.vars.outputs.tag }} | grep -E 'origin/mc/' | head -n 1 | sed 's|[[:space:]]*origin/||')
          
          if [ -z "$BRANCH_NAME" ]; then
            BRANCH_NAME="${{ steps.vars.outputs.tag }}"
          fi
          
          MC_VER=$(echo "$BRANCH_NAME" | sed 's|^mc/||')
          
          if [ -z "$MC_VER" ]; then
            MC_VER="unknown"
          fi
          
          echo "version=${MC_VER}" >> $GITHUB_OUTPUT

      - name: Update pack.mcmeta version
        env:
          RELEASE_VERSION: "${{ steps.vars.outputs.tag }}"
        run: |
          if [ -f "./pack.mcmeta" ]; then
            jq --arg ver "\n\u00A77Version $RELEASE_VERSION" '.pack.description |= . + $ver' ./pack.mcmeta > ./pack.mcmeta.tmp && mv ./pack.mcmeta.tmp ./pack.mcmeta
          fi

      - name: Archive files
        run: |
          FILE_NAME="VeinMiner-${{ steps.vars.outputs.tag }}"
          
          # Smart protection: avoid adding duplicate '-mc' suffix if already present in tag (e.g. v1.4.0-mc26.2)
          if [[ "${{ steps.vars.outputs.tag }}" != *"-mc"* ]]; then
            FILE_NAME="${FILE_NAME}-mc${{ steps.mc_version.outputs.version }}"
          fi
          
          FILE_NAME="${FILE_NAME}.zip"
          
          mkdir -p dist
          zip -rq "./dist/${FILE_NAME}" ./data/ ./pack.mcmeta ./pack.png

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.vars.outputs.tag }}
          name: "Release ${{ steps.vars.outputs.tag }}"
          generateReleaseNotes: true
          artifacts: "./dist/*.zip"
          artifactContentType: "application/zip"
