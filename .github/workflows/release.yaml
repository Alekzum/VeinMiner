name: Archive and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag for manual release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  lint:
    uses: ./.github/workflows/lint.yaml

  build-and-release:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update pack.mcmeta version
        env:
          RELEASE_VERSION: ${{ inputs.tag_name || github.ref_name }}
        run: |
          if [ -f "./pack.mcmeta" ]; then
            jq --arg ver "\n\u00A77Version $RELEASE_VERSION" '.pack.description |= . + $ver' ./pack.mcmeta > ./pack.mcmeta.tmp && mv ./pack.mcmeta.tmp ./pack.mcmeta
          fi

      - name: Archive files
        run: |
          mkdir -p dist
          zip -r ./dist/vein-miner.zip data/ pack.png pack.mcmeta 
      
      - name: Create GitHub Artifact
        # to publish it later in ./publish.yaml workflow
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: "Latest release"
          path: ./dist/vein-miner.zip
          compression-level: 0

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag_name || github.ref_name }}
          name: "Release ${{ inputs.tag_name || github.ref_name }}"
          generateReleaseNotes: true
          artifacts: "dist/*"
          artifactContentType: "application/zip"
          artifactErrorsFailBuild: true
          makeLatest: true
