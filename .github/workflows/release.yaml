name: Archive and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  lint:
    uses: ./.github/workflows/lint.yaml

  build-and-release:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: 'mc/1.14'
            mc_ver: '1.14'
          - branch: 'mc/1.20'
            mc_ver: '1.20'
          - branch: 'mc/26.2'
            mc_ver: '26.2'

    steps:
      - name: Checkout branch code
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Get release version
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Update pack.mcmeta version
        env:
          RELEASE_VERSION: "${{ steps.vars.outputs.tag }}"
        run: |
          if [ -f "./pack.mcmeta" ]; then
            jq --arg ver "\n\u00A77Version $RELEASE_VERSION" '.pack.description |= . + $ver' ./pack.mcmeta > ./pack.mcmeta.tmp && mv ./pack.mcmeta.tmp ./pack.mcmeta
          fi

      - name: Archive files
        run: |
          FILE_NAME="VeinMiner-${{ steps.vars.outputs.tag }}-mc${{ matrix.mc_ver }}.zip"

          mkdir -p dist
          zip -rq "./dist/${FILE_NAME}" ./data/ ./pack.mcmeta ./pack.png

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generateReleaseNotes: true
          allowUpdates: true
          artifacts: "./dist/*.zip"
          artifactContentType: "application/zip"
          artifactErrorsFailBuild: true
          makeLatest: true
