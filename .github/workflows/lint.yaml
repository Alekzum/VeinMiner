name: Lint

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: datapack-linter
        uses: ChenCMD/datapack-linter@v2.0.10
        with:
          GITHUB_TOKEN: ${{ github.token }}
          lintDirectory: .
