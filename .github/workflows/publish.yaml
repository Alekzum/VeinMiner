name: Publish Datapack

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update pack.mcmeta version
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          if [ -f "./pack.mcmeta" ]; then
            jq --arg ver "\n\u00A77Version $RELEASE_VERSION" '.pack.description |= . + $ver' ./pack.mcmeta > ./pack.mcmeta.tmp && mv ./pack.mcmeta.tmp ./pack.mcmeta
          fi

      - name: Archive files
        run: |
          mkdir -p dist
          zip -r ./dist/vein-miner.zip data/ pack.png pack.mcmeta 

      - name: Publish on Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: sQRiyYyA
          version: ${{ github.event.release.tag_name }}
          loaders: datapack
          game-versions: |
            1.20.5
            1.21.x
            26.1.x
            26.2.x
          files: ./dist/vein-miner.zip
          primary-file: vein-miner.zip
          environment: server_only
          changelog: ${{ github.event.release.body }}
        